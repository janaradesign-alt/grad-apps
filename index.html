<style>
html { background: #E7E6E2; -webkit-text-size-adjust: 100%; }

[hidden] { display: none !important; }

</style>
<style>
/* Quiet, sleek: warm off-white, soft rounded groups, floating pill dock with one dark action button. */
:root {
  --ground: #E7E6E2; --main: #F4F3F0; --card: #FFFFFF; --panel: #ECEBE7; --sel: #FAFAF8;
  --ink: #111111; --muted: #66665F; --line: rgba(17,17,17,.1); --dash: rgba(17,17,17,.3);
  --btn: #111111; --btn-ink: #FFFFFF; --yellow: #FFD21F; --accent: #FFD21F; --accent-ink: #111111; --accent-soft: rgba(255,210,31,.3);
  --hero1: #111111; --hero2: #111111; --hero-ink: #FFFFFF; --hero-bar: #FFD21F;
  --pos: #111111; --pos-bg: #111111; --warn: #7A5A00; --warn-bg: #FFD21F; --crit: #C4281A; --crit-bg: rgba(196,40,26,.1); --info: #111111; --info-bg: rgba(17,17,17,.08);
  --lift: none; --shadow: 0 30px 60px -34px rgba(0,0,0,.25);
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0A0A0A; --main: #121212; --card: #1C1C1C; --panel: #171717; --sel: #262626;
    --ink: #F3F3F1; --muted: #9B9B94; --line: rgba(255,255,255,.1); --dash: rgba(255,255,255,.3);
    --btn: #F3F3F1; --btn-ink: #111111; --yellow: #FFD21F; --accent: #FFD21F; --accent-ink: #111111; --accent-soft: rgba(255,210,31,.2);
    --hero1: #FFD21F; --hero2: #FFD21F; --hero-ink: #111111; --hero-bar: #111111;
    --pos: #111111; --pos-bg: #F3F3F1; --warn: #FFD21F; --warn-bg: #FFD21F; --crit: #FF9D8E; --crit-bg: rgba(255,130,110,.16); --info: #F3F3F1; --info-bg: rgba(255,255,255,.1);
    --lift: none; --shadow: 0 30px 60px -34px rgba(0,0,0,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0A0A0A; --main: #121212; --card: #1C1C1C; --panel: #171717; --sel: #262626;
  --ink: #F3F3F1; --muted: #9B9B94; --line: rgba(255,255,255,.1); --dash: rgba(255,255,255,.3);
  --btn: #F3F3F1; --btn-ink: #111111; --yellow: #FFD21F; --accent: #FFD21F; --accent-ink: #111111; --accent-soft: rgba(255,210,31,.2);
  --hero1: #FFD21F; --hero2: #FFD21F; --hero-ink: #111111; --hero-bar: #111111;
  --pos: #111111; --pos-bg: #F3F3F1; --warn: #FFD21F; --warn-bg: #FFD21F; --crit: #FF9D8E; --crit-bg: rgba(255,130,110,.16); --info: #F3F3F1; --info-bg: rgba(255,255,255,.1);
  --lift: none; --shadow: 0 30px 60px -34px rgba(0,0,0,.8); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ic { flex: none; display: block; }

.shell { max-width: 560px; margin: 0 auto; }
.screen { background: var(--main); min-height: 100vh; position: relative; }
@media (min-width: 700px) { .shell { max-width: 780px; } }
@media (min-width: 640px) { .shell { padding-block: 24px; } .screen { min-height: calc(100vh - 48px); border-radius: 44px; box-shadow: var(--shadow); overflow: clip; } }
.top { padding: calc(30px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 4px max(24px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .top { padding-top: 40px; } }
.top .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.top h1 { font-size: clamp(34px, 9vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; }
.top h1 .hi { display: block; font-size: .52em; font-weight: 400; letter-spacing: -0.01em; color: var(--muted); margin-bottom: 2px; }
.content { padding: 14px max(24px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); min-width: 0; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

.dockwrap { position: fixed; z-index: 30; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(560px, 100%); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: center; pointer-events: none; }
.dock { pointer-events: auto; flex: 1; min-width: 0; background: var(--card); border-radius: 30px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 14px 34px -12px rgba(30,36,28,.38); }
.dock button { background: none; border: 0; color: var(--muted); height: 48px; display: grid; place-items: center; border-radius: 22px; position: relative; }
.dock button[aria-current="page"] { color: var(--ink); background: var(--main); }
.fab { pointer-events: auto; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; box-shadow: 0 14px 28px -10px rgba(20,26,22,.55); flex: none; }
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(15,18,22,.42); border: 0; }
.sheet { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 0; width: min(560px, 100%); background: var(--main); border-radius: 30px 30px 0 0; padding: 14px max(24px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -20px 50px -20px rgba(0,0,0,.4); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--dash); margin: 0 auto 10px; }
.sheet .lrow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 2px; border: 0; background: none; text-align: left; font-size: 16px; min-height: 52px; border-bottom: 1px solid var(--line); }
.sheet .lrow:last-child { border-bottom: 0; }
.sheet .lrow .lbl { flex: 1; } .sheet .lrow[aria-current="page"] { font-weight: 700; }
.sheet h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); font-weight: 500; padding: 6px 2px; }
.count { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; background: var(--line); color: var(--muted); font-family: var(--font-mono); font-size: 12px; display: inline-grid; place-items: center; }

.btn { background: var(--card); border: 0; border-radius: 99px; padding: 8px 18px; font-weight: 500; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--lift); }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.danger { color: var(--crit); }
.btn.armed { background: var(--crit); color: #fff; }
.btn.small { padding: 4px 14px; font-size: 13px; min-height: 36px; }
.link { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 0; min-height: 36px; }
.dotbtn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 1px dotted var(--dash); background: transparent; border-radius: 18px; padding: 13px 16px; text-align: left; font-weight: 500; min-height: 48px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--pos-bg); color: var(--pos); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.crit { background: var(--crit-bg); color: var(--crit); } .chip.info { background: var(--info-bg); color: var(--info); }
select, input[type=text], input[type=date], input[type=url], input[type=number], textarea { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 2px; max-width: 100%; min-height: 40px; font-size: 16px; }
input:focus, textarea:focus, select:focus { outline: none; border-bottom: 1.5px solid var(--ink); }
select { font-size: 14px; font-weight: 500; }
select[data-tone=good] { color: var(--pos); } select[data-tone=warn] { color: var(--warn); } select[data-tone=crit] { color: var(--crit); }
textarea { width: 100%; min-height: 80px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); }
textarea:focus { border-color: var(--ink); }
.note { color: var(--muted); font-size: 13px; }
.h { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.fchip { border: 0; background: var(--card); border-radius: 99px; padding: 6px 15px; font-size: 13px; font-weight: 500; white-space: nowrap; min-height: 36px; box-shadow: var(--lift); }
.fchip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 99px; padding: 0 16px; min-height: 46px; color: var(--muted); box-shadow: var(--lift); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 10px 0; color: var(--ink); }

/* sections */
.sh { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 10px; }
.sh:first-child { margin-top: 6px; }
.sh h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 22px; color: var(--hero-ink); background: linear-gradient(150deg, var(--hero1), var(--hero2)); box-shadow: 0 20px 40px -22px rgba(20,26,22,.6); display: block; width: 100%; text-align: left; border: 0; }
.hero svg.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70%; opacity: .16; pointer-events: none; }
.hero > * { position: relative; }
.hero .k { font-size: 13px; opacity: .78; }
.hero .big { font-size: 56px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.hero .big small { font-size: .42em; font-weight: 400; opacity: .7; letter-spacing: 0; margin-left: 4px; }
.hero .bar { background: rgba(255,255,255,.22); margin: 16px 0 12px; height: 5px; } .hero .bar > i { background: #fff; }
.hero .nx { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.numeral { font-size: clamp(60px, 16vw, 92px); font-weight: 700; letter-spacing: -0.05em; line-height: .95; font-variant-numeric: tabular-nums; }
.numeral.crit { color: var(--crit); } .numeral.warn { color: var(--warn); }
.numeral small { font-size: .26em; letter-spacing: 0; color: var(--muted); margin-left: 6px; font-weight: 500; }
.card { background: transparent; border: 0; padding: 0; min-width: 0; margin-bottom: 14px; }
.card h2 { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); margin-bottom: 4px; }
.card .lead { font-weight: 500; }
.numrow { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 10px 0 14px; }
.dash { display: block; }
.bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.bar.over > i { background: var(--crit); }
.scroller { display: flex; gap: 12px; overflow-x: auto; padding: 2px 24px 14px; margin: 0 -24px; scroll-snap-type: x proximity; scrollbar-width: none; }
.pcard { flex: none; width: 176px; scroll-snap-align: start; background: var(--card); border: 0; border-radius: 24px; padding: 16px; text-align: left; display: grid; gap: 10px; box-shadow: var(--lift); align-content: space-between; min-height: 176px; }
.pcard .n { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.pcard .sc { color: var(--muted); font-size: 12px; }
.pcard .d { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.pcard .d b { font-size: 20px; color: var(--ink); font-family: var(--font-body); letter-spacing: -0.02em; }
.pcard .d b.crit { color: var(--crit); } .pcard .d b.warn { color: var(--warn); }
.list { display: flex; flex-direction: column; background: var(--card); border-radius: 24px; padding: 2px 18px; box-shadow: var(--lift); margin-top: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); background: none; }
.row:last-child { border-bottom: 0; }
.row.link { width: 100%; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink); font-size: 15px; }
.row.link:last-child { border-bottom: 0; }
.row .t { font-weight: 500; overflow-wrap: anywhere; } .row .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row.done .t { color: var(--muted); text-decoration: line-through; }
.dnum { font-family: var(--font-mono); font-size: 13px; text-align: right; white-space: nowrap; }
.dnum.crit { color: var(--crit); } .dnum.warn { color: var(--warn); }

.progs { display: flex; flex-direction: column; gap: 12px; }
.prog { background: var(--card); border-radius: 26px; box-shadow: var(--lift); scroll-margin-top: 16px; }
.prog-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; width: 100%; text-align: left; background: none; border: 0; padding: 18px 20px 16px; color: var(--ink); }
.prog-head .school { color: var(--muted); font-size: 13px; }
.prog-head .name { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.dl { text-align: right; min-width: 0; }
.dl .d { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.dl .days { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dl .days.crit { color: var(--crit); } .dl .days.warn { color: var(--warn); }
.stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; padding: 0 20px 14px; align-items: end; }
.sel { display: flex; flex-direction: column; min-width: 0; }
.sel label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.sel select { width: 100%; }
.detail { padding: 6px 20px 22px; display: grid; gap: 26px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.f { display: flex; flex-direction: column; min-width: 0; }
.f label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.f input, .f textarea, .f select { width: 100%; } .f.wide { grid-column: 1 / -1; }
.month { margin: 28px 0 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.month:first-child { margin-top: 0; }
.cal .row { grid-template-columns: 64px 44px minmax(0, 1fr) auto; }
.cal .dt { font-family: var(--font-mono); font-size: 13px; }
.fgroup { margin-bottom: 20px; }
.fgroup .gh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center; padding: 0 4px 4px; }
.fgroup .gh b { overflow-wrap: anywhere; }
.fgroup .box { background: var(--card); border-radius: 24px; padding: 2px 18px; box-shadow: var(--lift); }
.frow { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.frow:last-child { border-bottom: 0; }
.frow .ctrls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.frow .ctrls input[type=text] { flex: 1; min-width: 150px; }
.frow input.nm { font-weight: 700; font-size: 17px; width: 100%; }
.pick { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px; }
.pick input { width: 20px; height: 20px; accent-color: var(--ink); }
.split { display: block; }
.dlist { display: flex; flex-direction: column; background: var(--card); border-radius: 24px; padding: 2px 18px; box-shadow: var(--lift); }
.ditem { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 0; display: grid; gap: 4px; min-height: 56px; color: var(--ink); }
.ditem:last-child { border-bottom: 0; }
.ditem .t { font-weight: 600; overflow-wrap: anywhere; }
.ditem .s { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.editor { display: grid; gap: 14px; }
.editor textarea { min-height: 380px; font-size: 17px; line-height: 1.65; padding: 18px; border-radius: 22px; background: var(--card); border-color: transparent; box-shadow: var(--lift); }
.editor .foot { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.editor .cnt { font-family: var(--font-mono); font-size: 13px; } .editor .cnt.over { color: var(--crit); font-weight: 600; }
.split.has-sel .dcol { display: none; } .split:not(.has-sel) .editor { display: none; }
.back { display: inline-flex; }
.mgroup { padding: 4px 0 2px; margin-bottom: 18px; }
.mgroup .hd { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; padding: 0 4px; }
.mgroup .hd b { overflow-wrap: anywhere; font-size: 16px; }
.mgroup .bar { margin: 0 4px 8px; }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: end; }
.addrow input[type=text] { flex: 1; min-width: 160px; }
.tasks { background: var(--card); border-radius: 24px; padding: 2px 18px; box-shadow: var(--lift); }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check.done .tx, .check.done .tx input { color: var(--muted); text-decoration: line-through; }
.check input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--dash); background: transparent; display: grid; place-items: center; margin: 0; flex: none; }
.check input[type=checkbox]:checked { background: var(--btn); border-color: var(--btn); }
.check input[type=checkbox]:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--btn-ink); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.tx { overflow-wrap: anywhere; min-width: 0; } .tx input { width: 100%; border-bottom-color: transparent; }
.tx small { display: block; color: var(--muted); font-size: 12px; }
.empty { border: 1px dotted var(--dash); border-radius: 24px; padding: 34px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 16px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--main); padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.lcard { background: var(--card); border-radius: 24px; padding: 18px 20px; box-shadow: var(--lift); margin-bottom: 12px; }
@media (max-width: 440px) { .cal .row { grid-template-columns: 56px 38px minmax(0, 1fr) auto; } .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* v8: black and white, flat, one yellow accent */
.list, .tasks, .prog, .pcard, .tile, .lcard, .dlist, .fgroup .box, .editor textarea, .search, .btn, .fchip, .dock { box-shadow: none; border: 1px solid var(--line); }
.btn.primary { border-color: var(--btn); }
.fab { background: var(--btn); color: var(--btn-ink); box-shadow: none; }

    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    return Promise.resolve();
  }
  downloads = { save: function (o) { return saveFile(o.filename, o.data, /\.json$/.test(o.filename) ? 'application/json' : 'text/csv'); } };
  var fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = '.json,application/json'; fileIn.hidden = true; document.body.appendChild(fileIn);
  fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { try { db.importAll(String(r.result)); toast('Backup restored.'); } catch (e) { toast('That file is not a tracker backup.'); } fileIn.value = ''; };
    r.readAsText(f);
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null; if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'backup') { ui.drawer = false; render(); saveFile('grad-apps-backup-' + todayISO() + '.json', db.exportAll(), 'application/json').catch(function () { toast('Could not create the backup.'); }); }
    else if (act === 'restore') { ui.drawer = false; render(); fileIn.click(); }
  });

  // ---- boot ----
  render();
  (async function () {
    var seed = {};
    try { seed = await (await fetch('seed.json')).json(); } catch (e) { seed = { programs: {}, letters: {}, tasks: {}, drafts: {} }; }
    db = makeLocalDb(seed);
    ui.hasDb = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    function sub(coll) {
      db.collection(coll).onSnapshot(function (snap) {
        state[coll] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        L[coll] = true; schedule();
      });
    }
    sub('programs'); sub('letters'); sub('tasks'); sub('drafts'); sub('notes');
    render();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  })();
})();
</script>
</body>
